name: Deploy Web

on:
  push:
    branches:
      - main # يتم التشغيل عند الرفع على فرع main
    paths:
      - 'web/**' # فقط عند وجود تعديلات في الفرونت اند

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Web
        working-directory: ./web
        run: |
          npm install
          npm run build
          zip -r web-build.zip dist/

      - name: Copy Zip to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "web/web-build.zip"
          target: "/tmp"
          strip_components: 1

      - name: Unzip on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # إنشاء مجلد الفرونت اند على السيرفر إن لم يكن موجوداً
            mkdir -p ${{ secrets.SERVER_TARGET_WEB_PATH }}
            # فك الضغط في مجلد مؤقت
            unzip -o /tmp/web-build.zip -d /tmp/web-temp/
            # نسخ الملفات النهائية (المبنية) إلى مجلد الموقع الفعلي
            cp -r /tmp/web-temp/dist/* ${{ secrets.SERVER_TARGET_WEB_PATH }}
            # تنظيف الملفات المؤقتة
            rm -rf /tmp/web-temp /tmp/web-build.zip
