name: Deploy Web

on:
  push:
    branches:
      - main # يتم التشغيل عند الرفع على فرع main
    paths:
      - 'web/**' # فقط عند وجود تعديلات في الفرونت اند

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Web to Target Directory
        run: |
          mkdir -p ${{ secrets.SERVER_TARGET_WEB_PATH }}
          # Copy files from repository to the target path
          # We use rsync to avoid overwriting existing .env or node_modules
          rsync -av --exclude 'node_modules' --exclude 'dist' --exclude '.env*' ./web/ ${{ secrets.SERVER_TARGET_WEB_PATH }}/
          
      - name: Build and Start Nginx Container
        run: |
          cd $(dirname ${{ secrets.SERVER_TARGET_WEB_PATH }})
          docker compose -f docker-compose.prod.yml build nginx
          docker compose -f docker-compose.prod.yml up -d nginx
