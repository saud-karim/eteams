name: Deploy Backend

on:
  push:
    branches:
      - main # يتم التشغيل عند الرفع على فرع main
    paths:
      - 'backend/**' # فقط عند وجود تعديلات في الباك اند

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Backend to Target Directory
        run: |
          mkdir -p ${{ secrets.SERVER_TARGET_BACKEND_PATH }}
          # Copy files from repository to the target path
          # We use rsync to avoid overwriting existing .env, uploads, or node_modules
          rsync -av --exclude 'node_modules' --exclude 'dist' --exclude 'uploads' --exclude '.env*' ./backend/ ${{ secrets.SERVER_TARGET_BACKEND_PATH }}/
          
      - name: Build and Start Backend Container
        run: |
          cd $(dirname ${{ secrets.SERVER_TARGET_BACKEND_PATH }})
          docker compose -f docker-compose.prod.yml build backend
          docker compose -f docker-compose.prod.yml up -d backend
